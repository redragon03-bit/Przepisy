# Opis dodatku dla Home Assistant.
# Dokumentacja: https://developers.home-assistant.io/docs/add-ons/configuration
name: Przepisy
version: "0.2.1"
slug: przepisy
description: Aplikacja z przepisami (PWA na telefon)
url: https://github.com/redragon03-bit/Przepisy
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
# Aplikacja ma własny port - otwierasz ją w przeglądarce telefonu, nie w panelu HA
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: Aplikacja Przepisy
webui: "http://[HOST]:[PORT:8000]"
options:
  app_password: ""
  ai_provider: auto
  gemini_api_key: ""
  gemini_model: gemini-flash-latest
  anthropic_api_key: ""
  claude_model: claude-opus-5-5
schema:
  app_password: password
  ai_provider: list(auto|gemini|anthropic)
  gemini_api_key: password?
  gemini_model: str
  anthropic_api_key: password?
  claude_model: str
