# Opis dodatku dla Home Assistant.
# Dokumentacja: https://developers.home-assistant.io/docs/add-ons/configuration
name: Przepisy
version: "0.8.2"
slug: przepisy
description: Aplikacja z przepisami (PWA na telefon)
url: https://github.com/redragon03-bit/Przepisy
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
# Pozwala wysyłać listę zakupów do listy "Do zrobienia" w HA (token dostajemy automatycznie)
homeassistant_api: true
# Aplikacja ma własny port - otwierasz ją w przeglądarce telefonu, nie w panelu HA
ports:
  8000/tcp: 8000
  8443/tcp: 8443
ports_description:
  8000/tcp: Aplikacja Przepisy (http)
  8443/tcp: Aplikacja Przepisy (https, gdy jest certyfikat)
# Certyfikat HTTPS z dodatku Tailscale leży w /ssl (patrz DOCS.md)
map:
  - type: ssl
    read_only: true
webui: "http://[HOST]:[PORT:8000]"
# Cotygodniowe kopie aplikacji nie trafiają do kopii HA (HA i tak ma całą bazę i zdjęcia)
backup_exclude:
  - "*/backups/*"
  # Pobrany automatycznie yt-dlp (patrz services/ytdlp_update.py) - pobierze się na nowo
  - "*/pylib/*"
  - "*/pylib-new/*"
options:
  app_password: ""
  ai_provider: auto
  gemini_api_key: ""
  gemini_model: gemini-flash-latest
  gemini_fallback_model: gemini-flash-lite-latest
  groq_api_key: ""
  groq_model: openai/gpt-oss-120b
  mistral_api_key: ""
  mistral_model: mistral-small-latest
  anthropic_api_key: ""
  claude_model: claude-sonnet-5-5
  ha_todo_entity: todo.shopping_list
  ha_notify: ""
  certfile: tailscale.crt
  keyfile: tailscale.key
schema:
  app_password: password
  ai_provider: list(auto|gemini|groq|mistral|anthropic)
  gemini_api_key: password?
  gemini_model: str
  gemini_fallback_model: str?
  groq_api_key: password?
  groq_model: str?
  mistral_api_key: password?
  mistral_model: str?
  anthropic_api_key: password?
  claude_model: str
  ha_todo_entity: str?
  ha_notify: str?
  certfile: str?
  keyfile: str?
